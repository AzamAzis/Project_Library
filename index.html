<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1.0">
	<meta name="robots" content="follow, index">
	<meta name="apple-mobile-web-app-title" content="ML">
	<meta name="description" content="book">
	<meta name="twitter:title" content="book">
	<meta name="twitter:description" content="book">
	<meta name="twitter:image" content="book.jpg">
	<meta name="twitter:card" content="summary_large_image">
	<meta property="og:title" content="book">
	<meta property="og:description" content="book">
	<meta property="og:image" content="book.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="600">
	<meta property="og:type" content="website">
	<meta property="og:url" content="book.url">
	<link rel="stylesheet" href="assets/css/styles.css">
	<script src="script.js" defer></script>
	<title>My Library</title>
</head>
<body>
	<header class="header">
		<h1 class="__title">My Library</h1>
	</header>

	<main class="main">
		<search class="search-container">
			<form class="search" action="#" method="get">
				<input
					class="__input __search"
					name="search"
					type="search"
					inputmode="search"
					maxlength="500"
					placeholder="Toilet-bound Hanako-Kun"
				>

				<button class="__clear" type="button" aria-label="clear">
					<svg
						class="__img"
						xmlns="http://www.w3.org/2000/svg"
						aria-hidden="true"
						height="24px"
						viewBox="0 -960 960 960"
						width="24px"
						fill="#000000"
					>
						<path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
					</svg>
				</button>

				<button class="__submit" type="submit" aria-label="Search button.">
					<svg
						class="__img"
						xmlns="http://www.w3.org/2000/svg"
						aria-hidden="true"
						height="24px"
						viewBox="0 -960 960 960"
						width="24px"
						fill="#000"
					>
						<path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
					</svg>
				</button>
			</form>
		</search>

		<div class="button-container">
			<button
				class="book-btn"
				type="button"
				commandfor="add-book-dialog"
				command="show-modal"
			>
				Add A New Book
			</button>

			<button class="book-btn update" type="button">Update</button>
		</div>

	<dialog class="add-book" id="add-book-dialog">
		<button
			class="__close"
			type="button"
			aria-description="Click to close the modal"
			commandfor="add-book-dialog"
			command="close"
		>
			<svg
				class="__img"
				xmlns="http://www.w3.org/2000/svg"
				aria-hidden="true"
				height="24px"
				viewBox="0 -960 960 960"
				width="24px"
				fill="#000000"
			>
				<path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
			</svg>
		</button>

		<form class="__form" action="#" method="dialog" novalidate>
			<h3 class="__form-title">Add My Book</h3>
			<label class="__text" for="cover">Cover:</label>
			<input class="__cover" id="cover" name="cover" type="file" accept="image/*">
			<label class="__text" for="title">Title:</label>
			<input
				class="__input __title"
				id="title"
				name="title"
				type="text"
				inputmode="text"
				maxlength="500"
				placeholder="Toilet-bound Hanako-Kun"
				autofocus
				required
			>
			<label class="__text" for="vol">Vol:</label>
			<input
				class="__input __vol"
				id="vol"
				name="volume"
				type="number"
				inputmode="decimal"
				placeholder="1"
				step="1"
			>
			<label class="__text" for="author">Author:</label>
			<input
				class="__input __author"
				id="author"
				name="author"
				type="text"
				inputmode="text"
				maxlength="500"
				placeholder="AidaIro"
			>
			<label class="__text" for="link">Link:</label>
			<input
				class="__input __link"
				id="link"
				name="link"
				type="url"
				inputmode="url"
				placeholder="https://example-book.com"
			>
			<button type="submit" value="save">Save</button>
		</form>
	</dialog>

		<div class="book-container">
			<label class="book">
				<input
					class="__checkbox"
					name="book"
					type="checkbox"
					aria-description="Click to select the book."
					hidden
				>

				<img
					class="__cover"
					src="assets/img/book-cover/Hanako-cover.jpg"
					alt="Toilet-bound Hanako-Kun Cover."
				>

				<h2 class="__title">Toilet-bound Hanako-Kun</h2>
				<p class="__vol">Vol: 1</p>
				<p class="__author">Author: AidaIro</p>
				<p class="link-container">
					link:
					<a
						class="__link"
						href="https://www.amazon.com/dp/B074QTZGJ3?lv=shuf&channelId=500&plpRedirect=mhFallback"
						rel="noopener noreferrer"
						target="__blank"
					>
						Visit me.
					</a>
				</p>

				<div class="icon">
					<input
						class="__checkbox"
						name="book"
						type="checkbox"
						aria-description="Click to add to favorite."
					>
					<img class="__favorite" src="assets/img/icon/star-plus.svg" alt="Add to favorite">
				</div>
			</label>

			<label class="book">
				<input
					class="__checkbox"
					name="book"
					type="checkbox"
					aria-description="Click to select the book."
					hidden
				>

				<img
					class="__cover"
					src="assets/img/book-cover/Made-in-Abyss-cover.jpg"
					alt="Made in Abyss Cover."
				>

				<h2 class="__title">Made in Abyss</h2>
				<p class="__vol">Vol: 1</p>
				<p class="__author">Author: Akihito Tsukushi</p>
				<p class="link-container">
					Link:
					<a
						class="__link"
						href="https://www.amazon.com/dp/1626927731?lv=shuf&channelId=500&plpRedirect=mhFallback"
						rel="noopener noreferrer"
						target="__blank"
					>
						Visit me
					</a>
				</p>

				<div class="icon">
					<input
						class="__checkbox"
						name="book"
						type="checkbox"
						aria-description="Click to add to favorite."
					>
					<img
						class="__favorite"
						src="assets/img/icon/star-plus.svg"
						alt="Add to favorite"
					>
				</div>
			</label>

			<label class="book">
				<input
					class="__checkbox"
					name="book"
					type="checkbox"
					aria-description="Click to select the book."
					hidden
				>

				<img
					class="__cover"
					src="assets/img/book-cover/Asuras-Verdict-Cover.webp"
					alt="Asura's Verdict Cover."
				>

				<h2 class="__title">Asura's Verdict</h2>
				<p class="__vol">Vol: 1</p>
				<p class="__author">Utsugi Unohana</p>
				<p class="link-container">
					<a
						class="__link"
						href="https://www.ebay.com/itm/396332939412"
						rel="noopener noreferrer"
						target="__blank"
					>
						Visit me.
					</a>
				</p>

				<div class="icon">
					<input
						class="__checkbox"
						type="checkbox"
						aria-description="Click to add to favorite."
					>
					<img
						class="__favorite"
						src="assets/img/icon/star-plus.svg"
						alt="Add to favorite"
					>
				</div>
			</label>
		</div>
	</main>

	<footer>
		<p>
			<img src="#" alt="">
			<small>Azam Azis's Book Collection</small>
		</p>
	</footer>
</body>
</html>
