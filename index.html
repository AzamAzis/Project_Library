<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1.0">
	<meta name="robots" content="follow, index">
	<meta name="apple-mobile-web-app-title" content="ML">
	<meta name="description" content="book">
	<meta name="twitter:title" content="book">
	<meta name="twitter:description" content="book">
	<meta name="twitter:image" content="book.jpg">
	<meta name="twitter:card" content="summary_large_image">
	<meta property="og:title" content="book">
	<meta property="og:description" content="book">
	<meta property="og:image" content="book.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="600">
	<meta property="og:type" content="website">
	<meta property="og:url" content="book.url">
	<link rel="stylesheet" href="assets/css/styles.css">
	<script src="assets/js/script.js" defer></script>
	<title>My Library</title>
</head>
<body>
	<header class="header">
		<div class="added hidden" id="added">Book has been added to your library.</div>
		<h1 class="__title">My Library</h1>
	</header>

	<main class="main">
		<search class="search-container">
			<form class="search" action="#" method="get">
				<input
					class="__input __search"
					name="search"
					type="search"
					inputmode="search"
					maxlength="500"
					placeholder="Toilet-bound Hanako-Kun"
				>

				<button class="__clear" type="button" aria-label="clear">
					<svg
						class="__img"
						xmlns="http://www.w3.org/2000/svg"
						aria-hidden="true"
						height="24px"
						viewBox="0 -960 960 960"
						width="24px"
						fill="#000000"
					>
						<path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
					</svg>
				</button>

				<button class="__search-btn" type="submit" aria-label="Search button.">
					<svg
						class="__img"
						xmlns="http://www.w3.org/2000/svg"
						aria-hidden="true"
						height="24px"
						viewBox="0 -960 960 960"
						width="24px"
						fill="#000"
					>
						<path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
					</svg>
				</button>
			</form>
		</search>

		<div class="button-container">
			<button
				class="btn add"
				type="button"
				commandfor="add-book-dialog"
				command="show-modal"
			>
				Add A New Book
			</button>

			<button class="btn update" type="button">Update</button>
			<button class="btn remove hidden" type="button" disabled>Remove</button>
			<button class="btn check-all hidden" type="button">Check all</button>
			<button class="btn uncheck-all hidden" type="button" disabled>Uncheck All</button>
			<button class="btn confirm hidden" type="button">Confirm</button>
			<button class="btn cancel hidden" type="button">Cancel</button>
		</div>

		<ul class="book-container"></ul>

		<button class="btn show-more hidden" type="button">Show More</button>
	</main>

	<footer class="footer-container">
		<p class="footer">
			<img
				class="profile"
				src="https://avatars.githubusercontent.com/u/143481447?v=4"
				alt="Azam Azis's github profile"
				loading="lazy"
			>
			<small class="__text">Created By
				<a
					class="__link"
					href="https://github.com/AzamAzis"
					rel="noopener noreferrer"
					target="_blank"
				>
					Azam Azis
				</a>
			</small>
		</p>
	</footer>

		<dialog class="add-book-modal" id="add-book-dialog">
			<button
				class="__close"
				type="button"
				aria-description="Click to close the modal"
				commandfor="add-book-dialog"
				command="close"
			>
			<svg
				class="__img"
				xmlns="http://www.w3.org/2000/svg"
				aria-hidden="true"
				height="24px"
				viewBox="0 -960 960 960"
				width="24px"
				fill="#000000"
			>
				<path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
			</svg>
		</button>

		<form class="__form" action="#" method="dialog">
			<h3 class="__form-title">Add My Book</h3>
			<label class="__text" for="cover">Cover:</label>
			<input class="__cover __input-img hidden" id="cover" name="cover" type="file" accept="image/*">
			<div class="__preview">
				<p class="__preview-text">Preview</p>
			</div>
			<label class="btn __upload" for="cover" tabindex="0">Upload a cover</label>
			<label class="__text" for="title">Title:</label>
			<input
				class="__input __title"
				id="title"
				name="title"
				type="text"
				aria-describedby="required"
				inputmode="text"
				maxlength="500"
				placeholder="Toilet-bound Hanako-Kun"
				autofocus
				required
			>
			<p class="__required" id="required">The book's title is required</p>
			<label class="__text" for="vol">Vol:</label>
			<input
				class="__input __vol"
				id="vol"
				name="volume"
				type="number"
				inputmode="decimal"
				placeholder="1"
				step="1"
			>
			<label class="__text" for="author">Author:</label>
			<input
				class="__input __author"
				id="author"
				name="author"
				type="text"
				inputmode="text"
				maxlength="500"
				placeholder="AidaIro"
			>
			<label class="__text" for="link">Link:</label>
			<input
				class="__input __link"
				id="link"
				name="link"
				type="url"
				inputmode="url"
				placeholder="https://example-book.com"
			>
			<div class="__mark">
				<input class="__read-check" id="read-00" type="checkbox">
				<label class="__text __mark" for="read-00">Mark as read.</label>
			</div>
			<button class="btn __save" type="submit" value="save" aria-describedby="added">Save</button>
		</form>
	</dialog>
</body>
</html>
