<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1.0">
	<meta name="robots" content="follow, index">
	<meta name="apple-mobile-web-app-title" content="ML">
	<meta name="description" content="book">
	<meta name="twitter:title" content="book">
	<meta name="twitter:description" content="book">
	<meta name="twitter:image" content="book.jpg">
	<meta name="twitter:card" content="summary_large_image">
	<meta property="og:title" content="book">
	<meta property="og:description" content="book">
	<meta property="og:image" content="book.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="600">
	<meta property="og:type" content="website">
	<meta property="og:url" content="book.url">
	<link rel="stylesheet">
	<script src="script.js" defer></script>
	<title>Project: Library</title>
</head>
<body>
	<header class="header">
		<h1 class="__title">My Library</h1>
	</header>

	<main class="main">
		<search class="search-container">
			<form class="search" action="#" method="get">
				<button class="__submit" type="submit">
					<img src="assets/img/icon/search.svg" alt="search button">
				</button>
				<input
					class="__input"
					name="search"
					type="search"
					inputmode="search"
					maxlength="500"
					placeholder="Toilet-bound Hanako-Kun"
				>
			</form>
		</search>

		<div>
			<button
				type="button"
				popovertarget="add-book-dialog"
				popovertargetaction="show"
			>
				Add A New Book
			</button>
			<dialog id="add-book-dialog" popover>
				<button
					type="button"
					aria-description="Click to close the modal"
					popovertarget="add-book-dialog"
					popovertargetaction="hide"
				>
					<img src="assets/img/icon/close.svg" alt="Close">
				</button>
				<h3>Add The Book</h3>
				<form action="#" method="dialog">
					<label for="title">Title:</label>
					<input
						id="title"
						name="title"
						type="text"
						inputmode="text"
						maxlength="500"
						placeholder="Toilet-bound Hanako-Kun"
						autofocus
						required
					>

					<label for="vol">Vol:</label>
					<input
						id="vol"
						name="volume"
						type="number"
						inputmode="decimal"
						placeholder="1"
						step="1"
					>

					<label for="author">Author:</label>
					<input
						id="author"
						name="author"
						type="text"
						inputmode="text"
						maxlength="500"
						placeholder="AidaIro"
					>

					<label for="link">Link:</label>
					<input
						name="link"
						type="url"
						inputmode="url"
						placeholder="https://example-book.com"
					>

					<button type="submit" value="save">Save</button>
				</form>
			</dialog>
			<button type="button">Update</button>
		</div>

		<div class="card-container">
			<label class="card">
				<input
					class="__checkbox"
					name="book"
					type="checkbox"
					aria-description="Click to select the book."
				>
				<img
					class="__cover"
					src="assets/img/book-cover/Hanako-cover.jpg"
					alt="Toilet-bound Hanako-Kun Cover."
				>
				<h2 class="__title">Toilet-bound Hanako-Kun</h2>
				<div class="icon">
					<input
						class="__checkbox"
						name="book"
						type="checkbox"
						aria-description="Click to add to favorite."
					>
					<img class="__favorite" src="assets/img/icon/star-plus.svg" alt="Add to favorite">
				</div>
			</label>

			<label class="card">
				<input
					class="__checkbox"
					name="book"
					type="checkbox"
					aria-description="Click to select the book."
				>
				<img
					class="__cover"
					src="assets/img/book-cover/Made_in_Abyss-cover.jpg"
					alt="Made in Abyss Cover."
				>
				<h2 class="__title">Made in Abyss</h2>
				<div class="icon">
					<input
						class="__checkbox"
						name="book"
						type="checkbox"
						aria-description="Click to add to favorite."
					>
					<img
						class="__favorite"
						src="assets/img/icon/star-plus.svg"
						alt="Add to favorite"
					>
				</div>
			</label>

			<label class="card">
				<input
					class="__checkbox"
					name="book"
					type="checkbox"
					aria-description="Click to select the book."
				>
				<img
					class="__cover"
					src="assets/img/book-cover/Asura-cover.jpg"
					alt="Asura's Verdict Cover."
				>
				<h2 class="__title">Asura's Verdict</h2>
				<div class="icon">
					<input
						class="__checkbox"
						type="checkbox"
						aria-description="Click to add to favorite."
					>
					<img
						class="__favorite"
						src="assets/img/icon/star-plus.svg"
						alt="Add to favorite"
					>
				</div>
			</label>
		</div>
	</main>

	<footer>
		<p>
			<img src="#" alt="">
			<small>Azam Azis's Book Collection</small>
		</p>
	</footer>
</body>
</html>
